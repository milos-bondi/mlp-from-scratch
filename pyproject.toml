[project]
name = "mlp-from-scratch"
version = "0.1.0"
description = "A NumPy multi-layer perceptron implemented from scratch and compared with PyTorch"
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pytest>=8.0",
    "torch>=2.2",
    "torchvision>=0.17",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
[tool.setuptools.packages.find]
where = ["src"]
